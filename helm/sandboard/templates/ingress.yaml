{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sandboard.fullname" . }}
  labels:
    {{- include "sandboard.labels" . | nindent 4 }}
  annotations:
    # Same pattern as keycloak / openshell — Tailscale operator provisions a
    # dedicated tailnet device and TLS for this hostname.
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "sandboard.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
  tls:
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
{{- end }}
