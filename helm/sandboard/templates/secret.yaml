{{- $secretName := include "sandboard.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $masterKey := .Values.masterKey -}}
{{- $pgPassword := .Values.postgres.password -}}
{{- if $existing -}}
  {{- if not $masterKey -}}
    {{- $masterKey = index $existing.data "master-key" | b64dec -}}
  {{- end -}}
  {{- if not $pgPassword -}}
    {{- $pgPassword = index $existing.data "postgres-password" | b64dec -}}
  {{- end -}}
{{- end -}}
{{- if not $masterKey -}}
  {{- /* 32 random bytes as 64 hex chars — matches SANDBOARD_MASTER_KEY / KEY_LEN */ -}}
  {{- $masterKey = randAlphaNum 32 | sha256sum -}}
{{- end -}}
{{- if not $pgPassword -}}
  {{- $pgPassword = randAlphaNum 32 -}}
{{- end -}}
{{- $databaseUrl := printf "postgres://%s:%s@%s:5432/%s" .Values.postgres.user $pgPassword (include "sandboard.postgres.serviceName" .) .Values.postgres.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "sandboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  master-key: {{ $masterKey | quote }}
  postgres-password: {{ $pgPassword | quote }}
  database-url: {{ $databaseUrl | quote }}
