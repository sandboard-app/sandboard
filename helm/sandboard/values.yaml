# sandboard board image (API + built UI)
image:
  repository: quay.io/sandboard-app/sandboard
  tag: latest
  # Always — :latest + IfNotPresent leaves a stale node cache after push.
  pullPolicy: Always

# Replica count. Keep at 1 — board state is not multi-writer safe yet, and
# Postgres is a single RWO volume.
replicaCount: 1

# Tailscale Ingress — set per deploy (do not commit personal *.ts.net names).
# hostname is the short MagicDNS label; the operator appends .<tailnet>.ts.net.
# publicUrl is SANDBOARD_PUBLIC_URL (MCP Host allow-list + OpenShell OIDC
# redirect_uri = {publicUrl}/oauth/openshell/callback). Must match the
# resolved Tailscale URL. When you change it, also add that callback (and the
# origin) to Keycloak realm `openshell` client `openshell-cli` redirectUris /
# webOrigins — Keycloak rejects anything not on that allow-list.
#
#   helm upgrade --install sandboard ./helm/sandboard -n sandboard \
#     --set ingress.hostname=my-sandboard \
#     --set ingress.publicUrl=https://my-sandboard.<tailnet>.ts.net
ingress:
  enabled: true
  hostname: ""
  publicUrl: ""

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Board Postgres (single-replica StatefulSet in this chart)
postgres:
  image: docker.io/library/postgres:16-alpine
  user: sandboard
  database: sandboard
  # Empty → chart generates and stores in Secret (stable across upgrades).
  password: ""
  persistence:
    size: 5Gi
    # Empty → cluster default StorageClass (topolvm-provisioner on microshift).
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Empty → chart generates a fresh 64-hex-char key and stores it in Secret.
# Do not reuse the host ~/.config/sandboard/master.key unless you intentionally
# want to decrypt Settings sealed on that machine.
masterKey: ""
