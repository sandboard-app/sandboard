[book]
title = "sandboard"
description = "Operator docs for running and understanding sandboard"
language = "en"
src = "docs"

[build]
build-dir = "target/mdbook"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
git-repository-url = "https://github.com/sandboard-app/sandboard"
edit-url-template = "https://github.com/sandboard-app/sandboard/edit/main/docs/{path}"
# Org root site: https://sandboard-app.github.io/ (published to sandboard-app/sandboard-app.github.io)
site-url = "/"
no-section-label = true
additional-css = ["landing.css"]
# Dropped next to book.toml by `mdbook-mermaid install` (make docs / CI).
additional-js = ["mermaid.min.js", "mermaid-init.js", "landing.js"]

[output.html.search]
enable = true

# Pages whose content moved. The site is young, but these URLs are already in
# the wild — a link that 404s teaches nothing.
[output.html.redirect]
"/agents.html" = "first-agent.html"
"/task-repo-binding.html" = "workflow.html#which-repo-an-agent-clones"
