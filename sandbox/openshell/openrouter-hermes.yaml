# OpenShell provider type for Hermes Agent using OpenRouter.
# The provider injects OPENROUTER_API_KEY into the Hermes sandbox; the image
# wrapper selects the OpenRouter OpenAI-compatible endpoint.
id: openrouter-hermes
display_name: OpenRouter (Hermes)
description: OpenRouter API key for Hermes Agent
category: agent
credentials:
  - name: api_key
    description: OpenRouter API key for Hermes Agent
    env_vars:
      - OPENROUTER_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
discovery:
  credentials:
    - api_key
endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/hermes
  - /opt/hermes/.venv/bin/hermes
  - /opt/hermes/.venv/bin/python
  - /usr/bin/python3.12
  - /bin/sh
  - /usr/bin/sh
  - /bin/bash
  - /usr/bin/bash
inference_capable: false
