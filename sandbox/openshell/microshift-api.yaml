# OpenShell provider type for CRC / MicroShift / OCP API access from a
# Podman (or in-cluster) sandbox.
#
# Sandboard seals KUBE_TOKEN; the sandbox proxy rewrites Bearer on MITM
# (protocol: rest). Host-side Podman seats reach the cluster through the
# Tailscale Kubernetes operator's API proxy
# (`https://microshift-operator.<tailnet>.ts.net`) — same trust pattern as
# a Tailscale-exposed console. That proxy presents a Tailscale HTTPS cert
# (MITM verifies with public CAs) and OpenShell does not block :443.
#
# Grant the gateway host's Tailscale identity RBAC on the cluster (see
# `sandbox/microshift/tailscale-api-rbac.yaml`). Point `oc`/`kubectl` at your
# operator MagicDNS URL (or in-cluster `kubernetes.default.svc`) via normal
# kubeconfig / CLI flags — this provider only supplies `KUBE_TOKEN` + egress.
id: microshift-api
display_name: MicroShift / OCP API
description: ServiceAccount token as KUBE_TOKEN (Bearer rewrite to the cluster API)
category: agent
credentials:
  - name: kube_token
    description: ServiceAccount bearer token for the cluster API
    env_vars:
      - KUBE_TOKEN
    required: true
    auth_style: bearer
    header_name: authorization
    query_param: ""
discovery:
  credentials:
    - kube_token
endpoints:
  # Host-side Podman → cluster via Tailscale operator API proxy.
  # Wildcard matches any tailnet MagicDNS suffix; do not bake a personal
  # `*.ts.net` FQDN into this file.
  - host: microshift-operator.*.ts.net
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: microshift-operator
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  # In-cluster OpenShell seats.
  - host: kubernetes.default.svc
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: kubernetes.default.svc.cluster.local
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /opt/openshift/oc
  - /opt/openshift/kubectl
  - /usr/local/bin/oc
  - /usr/local/bin/kubectl
  - /usr/bin/curl
inference_capable: false
