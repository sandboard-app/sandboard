[package]
name = "sandboard"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower-service = "0.3"
base64 = "0.23"
hyper = "1"
hyper-util = "0.1"

rmcp = { version = "3.0", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-async-rw",
    "tower",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"

chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
# Faster locks than std; deadlock_detection dumps holders when we freeze
# (std RwLock just hangs — see snapshot/agent_runtime reentrancy).
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "chrono", "json"] }
chacha20poly1305 = "0.11.0"
rand = "0.10.2"
dirs = "6.0.0"
tonic = { version = "0.14", features = ["channel", "tls-ring", "tls-native-roots", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
tar = "0.4.46"
rustls = { version = "0.23.43", default-features = false, features = ["std", "logging", "tls12", "ring"] }
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "69a05ebb3b154e304a66fe80eed8504e889abc6d", version = "0.0.0", default-features = false }
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", rev = "69a05ebb3b154e304a66fe80eed8504e889abc6d", version = "0.0.0" }
openshell-providers = { git = "https://github.com/NVIDIA/OpenShell", rev = "69a05ebb3b154e304a66fe80eed8504e889abc6d", version = "0.0.0" }
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", rev = "69a05ebb3b154e304a66fe80eed8504e889abc6d", version = "0.0.0" }
oauth2 = "5"
argon2 = "0.5.3"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
axum-extra = { version = "0.12.6", features = ["cookie"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
time = "0.3.55"
tower = { version = "0.5.3", features = ["util"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
serde_urlencoded = "0.7"
