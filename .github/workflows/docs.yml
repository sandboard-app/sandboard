name: Docs

# Build mdBook here; publish HTML to sandboard-app/sandboard-app.github.io
# → https://sandboard.io/
#
# Secret PAGES_DEPLOY_KEY: private half of a write deploy key on
# sandboard-app/sandboard-app.github.io (org deploy keys must be enabled).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - "web/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - "web/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Ref-scoped: cancel-in-progress only affects the same PR or git ref.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The book's images are captured from a real board, not committed. `web/**`
  # is in the path filter so a UI change reshoots them; `src/**` deliberately is
  # not, or every backend commit would republish the site. Reach for
  # workflow_dispatch when a board change needs to show up in the docs.
  shots:
    runs-on: ubuntu-latest
    steps:
      # This job runs `npm ci` and `cargo build` — arbitrary build scripts —
      # and pushes nothing. No reason to leave GITHUB_TOKEN in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        run: |
          npm ci --prefix web
          npm run --prefix web build

      - uses: dtolnay/rust-toolchain@stable

      # Read the cache CI's `rust` job owns; do not write a second copy. Two
      # ~650MB caches of the same dependency tree evict each other out of the
      # repo's 10GB budget, which shows up later as a surprise cold build.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust
          save-if: false

      # The harness serves the fixture from a real sandboard. Its fallback mock
      # server answers a snapshot shape the board no longer emits, so strict
      # mode below refuses to run without this binary.
      - name: Build sandboard
        run: cargo build --bin sandboard

      - name: Install Playwright chromium
        run: npx --prefix web playwright install --with-deps chromium

      - name: Capture board screenshots
        env:
          SANDBOARD_SHOTS_STRICT: "1"
        run: npm run --prefix web shots

      - uses: actions/upload-artifact@v4
        with:
          name: docs-images
          path: web/shots/
          retention-days: 1
          if-no-files-found: error

  build:
    needs: shots
    runs-on: ubuntu-latest
    steps:
      # Publishing below authenticates with PAGES_DEPLOY_KEY, not the checkout
      # token, so nothing here needs GITHUB_TOKEN left in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # mdBook copies non-markdown files out of `src`, so images land at
      # /images/* in the built book and in the deployed site.
      - uses: actions/download-artifact@v4
        with:
          name: docs-images
          path: docs/images

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"

      # actions-mdbook only installs mdbook itself; the mermaid preprocessor
      # (book.toml [preprocessor.mermaid]) needs its own binary on PATH.
      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin mdbook-mermaid

      # Mermaid browser assets are not in git — drop mermaid.min.js / mermaid-init.js
      # next to book.toml (same files `make docs` fetches locally).
      - name: Fetch mermaid assets
        run: mdbook-mermaid install .

      - name: Build book
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /
        run: mdbook build

      - name: Publish to sandboard-app.github.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: sandboard-app/sandboard-app.github.io
          publish_branch: main
          publish_dir: ./target/mdbook
          cname: sandboard.io
          # Orphan commits keep the pages repo = HTML only (legacy branch Pages).
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
